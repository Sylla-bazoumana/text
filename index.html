<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mes tâches</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="panel">
    <header>
      <h1>Mes tâches</h1>
      <p id="progress" role="status"></p>
    </header>

    <form id="task-form">
      <label for="task-input">Nouvelle tâche</label>
      <div class="form-row">
        <input id="task-input" name="task" type="text" required>
        <button class="add" type="submit">Ajouter</button>
      </div>
    </form>

    <p id="storage-message" role="status" hidden></p>
    <p id="empty" class="empty">Aucune tâche pour le moment.</p>
    <ul id="tasks" aria-label="Liste des tâches"></ul>
  </main>
</body>
</html>
